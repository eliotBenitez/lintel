<?xml version="1.0" encoding="UTF-8"?>
<!-- Single-colour symbolic icon: GNOME/St recolours it to the panel foreground
     because the filename ends in -symbolic.svg. Two stacked toggle switches —
     an outlined one with the knob at the leading edge above a filled one with
     the knob knocked out at the trailing edge — matching the macOS Tahoe
     Control Center glyph. Geometry mirrors _newControlCenterIcon() in
     src/widgets/controlCenter.js; this file is the fallback asset. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <mask id="lintel-cc-knob">
    <rect width="16" height="16" fill="#ffffff"/>
    <rect x="8.2" y="10" width="4.6" height="2.8" rx="1.4" fill="#000000"/>
  </mask>
  <g fill="#2e3436">
    <rect x="2.35" y="2.35" width="11.3" height="4.5" rx="2.25"
          fill="none" stroke="#2e3436" stroke-width="1.1"/>
    <rect x="3.2" y="3.2" width="4.6" height="2.8" rx="1.4"/>
    <rect x="1.8" y="8.6" width="12.4" height="5.6" rx="2.8"
          mask="url(#lintel-cc-knob)"/>
  </g>
</svg>
